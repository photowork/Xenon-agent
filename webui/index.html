<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenon - 智能助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            height: 100dvh;
        }

        .sidebar {
            width: 280px;
            background: #16162a;
            border-right: 1px solid #2d2d44;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2d2d44;
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #00d4aa;
            margin-bottom: 15px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background: #00d4aa;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #00b896;
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            padding: 12px;
            margin-bottom: 5px;
            background: #1e1e36;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .session-item:hover {
            background: #2a2a4a;
        }

        .session-item.active {
            background: #00d4aa;
            color: #1a1a2e;
        }

        .session-title {
            flex: 1;
            min-width: 0;
            white-space: normal;
            overflow: hidden;
            font-size: 0.9rem;
            line-height: 1.25;
        }

        .session-theme {
            white-space: nowrap;
        }

        .session-time {
            color: #8a8aa8;
            font-size: 0.76rem;
            margin-left: 6px;
            white-space: nowrap;
        }

        .session-item.active .session-time {
            color: rgba(26, 26, 46, 0.7);
        }

        .session-delete {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            padding: 5px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .session-delete:hover {
            opacity: 1;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 15px 20px;
            background: #16162a;
            border-bottom: 1px solid #2d2d44;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-weight: 500;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .app-version {
            flex: 0 0 auto;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .header-indicators {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .timer-status {
            flex: 0 0 auto;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            display: none;
        }
        .timer-status.has-timers {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .timer-status.has-messages {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .model-select {
            background: #1e1e36;
            color: #eee;
            border: 1px solid #2d2d44;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.85rem;
            outline: none;
            max-width: 220px;
        }

        .context-usage {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 28px;
            padding: 0 14px;
            background:
                linear-gradient(90deg, #bde3b4 0 calc(100% - 14px), #4cab36 calc(100% - 14px));
            color: var(--x-green);
            border: 0;
            border-radius: 0;
            font-size: 0.84rem;
            font-weight: 800;
            white-space: nowrap;
            transition: color 0.3s;
        }

        .context-usage .usage-label {
            font-variant-numeric: tabular-nums;
        }

        .context-usage .usage-bar {
            display: inline-block;
            width: 56px;
            height: 5px;
            background: rgba(25, 73, 60, 0.22);
            border-radius: 0;
            overflow: hidden;
            vertical-align: middle;
        }

        .context-usage .usage-bar-fill {
            display: block;
            height: 100%;
            border-radius: 0;
            transition: width 0.5s ease, background 0.3s;
        }

        .context-usage.level-low .usage-bar-fill     { background: #04632c; }
        .context-usage.level-medium .usage-bar-fill  { background: #ffc107; }
        .context-usage.level-high .usage-bar-fill    { background: #ff7043; }
        .context-usage.level-critical .usage-bar-fill { background: #b95d4f; }

        .context-usage.level-low     { color: #04632c; }
        .context-usage.level-medium  { color: #b8860b; }
        .context-usage.level-high    { color: #bf360c; }
        .context-usage.level-critical { color: #b95d4f; }

        .model-select:focus {
            border-color: #00d4aa;
        }

        .model-select:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: #00d4aa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: #00d4aa;
            color: #1a1a2e;
        }

        .message.assistant {
            align-self: flex-start;
            background: #2a2a4a;
            color: #eee;
        }

        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
        }

        .thinking {
            color: #c77dff;
            font-style: italic;
            font-size: 0.9rem;
            margin-bottom: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
            padding: 6px 12px;
        }

        .tool-call {
            background: #3a3a5a;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            margin: 4px 0;
            color: #ffd700;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-all;
            max-width: 100%;
            overflow-x: auto;
        }

        .tool-result {
            background: #1e1e36;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #888;
            margin: 4px 0;
            max-height: 200px;
            overflow-y: auto;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
        }

        .tool-progress {
            background: #243b4f;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #9ee7ff;
            margin: 4px 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            max-width: 100%;
        }

        .msg-details {
            margin: 6px 0;
            border: 1px solid #2d2d44;
            border-radius: 6px;
            overflow: hidden;
        }

        .msg-details > summary {
            cursor: pointer;
            padding: 6px 12px;
            background: #252540;
            color: #aaa;
            font-size: 0.85rem;
            font-weight: 600;
            user-select: none;
            list-style: none;
        }

        .msg-details > summary::-webkit-details-marker {
            display: none;
        }

        .msg-details > summary::before {
            content: "▶ ";
            font-size: 0.7rem;
            margin-right: 4px;
        }

        .msg-details[open] > summary::before {
            content: "▼ ";
        }

        .input-container {
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            background: #16162a;
            border-top: 1px solid #2d2d44;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .input-box {
            flex: 1;
            min-width: 0;
            background: #1e1e36;
            border: 1px solid #2d2d44;
            border-radius: 8px;
            padding: 12px;
            color: #eee;
            font-size: 1rem;
            resize: none;
            min-height: 48px;
            max-height: 200px;
            font-family: inherit;
            max-width: 100%;
            box-sizing: border-box;
        }

        .input-box:focus {
            outline: none;
            border-color: #00d4aa;
        }

        .send-btn {
            padding: 12px 24px;
            background: #00d4aa;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background: #00b896;
        }

        .send-btn:disabled {
            background: #3a3a5a;
            cursor: not-allowed;
        }

        .stop-btn {
            padding: 12px 24px;
            background: #ff6b6b;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .stop-btn:hover {
            background: #e55a5a;
        }

        .queue-btn {
            padding: 12px 24px;
            background: #f0a050;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            position: relative;
        }

        .queue-btn:hover:not(:disabled) {
            background: #e09040;
        }

        .queue-btn:disabled {
            background: #3a3a5a;
            cursor: not-allowed;
        }

        .queue-btn .queue-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff6b6b;
            color: #fff;
            font-size: 0.7rem;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .queued-message {
            opacity: 0.65;
            border-left: 3px solid #f0a050;
            padding-left: 12px;
        }

        .queued-message .queue-status {
            font-size: 0.78rem;
            color: #f0a050;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .queued-message .queue-status.processing {
            color: #00d4aa;
        }

        .queue-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f0a050;
            border-top-color: transparent;
            border-radius: 50%;
            animation: queue-spin 0.8s linear infinite;
        }

        .queued-message .queue-status.processing .queue-spinner {
            border-color: #00d4aa;
            border-top-color: transparent;
        }

        @keyframes queue-spin {
            to { transform: rotate(360deg); }
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #2a2a4a;
            border-radius: 12px;
            align-self: flex-start;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #00d4aa;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;
                z-index: 101;
            }

            .sidebar.open {
                transform: translateX(280px);
            }

            .sidebar-overlay.open {
                display: block;
            }

            .mobile-menu-btn {
                display: block;
            }

            .chat-header {
                gap: 10px;
            }

            .model-select {
                max-width: 48vw;
                font-size: 0.78rem;
            }

            .message {
                max-width: 90%;
            }

            .messages-container {
                padding: 10px;
            }

            .input-container {
                padding: 12px 10px;
                padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            }

            .send-btn {
                padding: 12px 16px;
                flex-shrink: 0;
            }

            .main-content {
                width: 100%;
                max-width: 100vw;
                overflow: hidden;
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state h2 {
            color: #00d4aa;
            margin-bottom: 10px;
        }

        /* Markdown 渲染样式 */
        .message-content h1, .message-content h2, .message-content h3,
        .message-content h4, .message-content h5, .message-content h6 {
            margin: 1em 0 0.5em;
            color: #00d4aa;
            line-height: 1.3;
        }
        .message-content h1 { font-size: 1.4em; border-bottom: 1px solid #2d2d44; padding-bottom: 0.3em; }
        .message-content h2 { font-size: 1.2em; }
        .message-content h3 { font-size: 1.1em; }
        .message-content p { margin: 0.5em 0; line-height: 1.6; }
        .message-content ul, .message-content ol { margin: 0.5em 0; padding-left: 1.5em; }
        .message-content li { margin: 0.25em 0; line-height: 1.5; }
        .message-content blockquote {
            border-left: 3px solid #00d4aa;
            margin: 0.5em 0;
            padding: 0.3em 1em;
            background: rgba(0, 212, 170, 0.08);
            border-radius: 0 4px 4px 0;
        }
        .message-content blockquote p { margin: 0.3em 0; }
        .message-content code {
            background: #2d2d44;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.88em;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }
        .message-content pre {
            background: #0d0d1a;
            border: 1px solid #2d2d44;
            border-radius: 6px;
            padding: 1em;
            margin: 0.8em 0;
            overflow-x: auto;
        }
        .message-content pre code {
            background: none;
            padding: 0;
            font-size: 0.85em;
            line-height: 1.5;
        }
        .message-content table {
            border-collapse: collapse;
            margin: 0.8em 0;
            width: 100%;
            font-size: 0.9em;
        }
        .message-content th, .message-content td {
            border: 1px solid #2d2d44;
            padding: 8px 12px;
            text-align: left;
        }
        .message-content th {
            background: #1e1e36;
            color: #00d4aa;
            font-weight: 600;
        }
        .message-content tr:nth-child(even) {
            background: rgba(255,255,255,0.02);
        }
        .message-content hr {
            border: none;
            border-top: 1px solid #2d2d44;
            margin: 1em 0;
        }
        .message-content a {
            color: #00d4aa;
            text-decoration: underline;
        }
        .message-content a:hover {
            color: #00f0c0;
        }
        .message-content img {
            max-width: 100%;
            border-radius: 6px;
            margin: 0.5em 0;
        }
        .message-content strong { color: #fff; }

        /* Xenon interface refresh based on XENON.svg */
        :root {
            --x-paper: #e6ddc8ff;
            --x-paper-soft: #d9cca8;
            --x-rail: #a99669;
            --x-sidebar: #92a391;
            --x-sidebar-deep: #729d90;
            --x-moss: #697c73;
            --x-moss-deep: #19493c;
            --x-aqua: #8dd1c4;
            --x-aqua-bright: #76dcbd;
            --x-aqua-pale: #cde8e5;
            --x-lime: #e7eda1;
            --x-lime-deep: #a3a95b;
            --x-cream: #fbffde;
            --x-green: #04632c;
            --x-danger: #b95d4f;
            --x-ink: #12382f;
            --x-line: rgba(25, 73, 60, 0.22);
            --x-shadow: rgba(25, 73, 60, 0.16);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--x-sidebar-deep) transparent;
        }

        body {
            font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: #7f9188;
            color: var(--x-ink);
        }

        ::selection {
            background: var(--x-aqua-bright);
            color: var(--x-moss-deep);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--x-sidebar-deep);
            border: 3px solid transparent;
            background-clip: padding-box;
        }

        .container {
            background: var(--x-paper);
            min-width: 0;
        }

        .sidebar {
            --x-sidebar-rail: 10px;
            --x-sidebar-tools-height: 132px;
            width: 280px;
            background: var(--x-sidebar);
            border-right: 0;
            color: var(--x-cream);
            position: relative;
            overflow: hidden;
            transition: transform 0.24s ease;
        }

        .sidebar::before {
            content: "";
            position: absolute;
            top: 92px;
            right: 0;
            bottom: var(--x-sidebar-tools-height);
            width: var(--x-sidebar-rail);
            background: var(--x-sidebar-deep);
            pointer-events: none;
            z-index: 0;
        }

        .sidebar-header,
        .sidebar-tools,
        .sessions-list {
            position: relative;
            z-index: 1;
        }

        .sidebar-header {
            padding: 28px 16px 18px;
            border-bottom: 0;
        }

        .sidebar-title {
            color: var(--x-cream);
            font-size: 1.45rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 18px;
            text-align: center;
            text-transform: uppercase;
        }

        .sidebar-title::after {
            content: none;
        }

        .session-item {
            border-radius: 0;
            box-shadow: inset -9px 0 0 var(--x-lime-deep);
        }

        .new-chat-btn {
            display: block;
            width: 118px;
            min-height: 42px;
            margin: 0 auto;
            padding: 10px 18px;
            background: #90e5cf;
            color: var(--x-moss-deep);
            border: 0;
            border-radius: 0;
            font-size: 0.92rem;
            font-weight: 800;
            box-shadow: none;
        }

        .new-chat-btn:hover {
            background: var(--x-aqua-bright);
        }

        .sidebar-tools {
            min-height: var(--x-sidebar-tools-height);
            margin: 0;
            width: 100%;
            background: var(--x-aqua);
            border: 0;
            border-radius: 0;
            box-shadow: none;
            flex: 0 0 auto;
        }

        .new-chat-btn:focus-visible,
        .session-item:focus-visible,
        .session-action-toggle:focus-visible,
        .mobile-menu-btn:focus-visible,
        .send-btn:focus-visible,
        .stop-btn:focus-visible,
        .queue-btn:focus-visible,
        .input-box:focus-visible {
            outline: none;
        }

        .new-chat-btn:focus-visible,
        .session-item:focus-visible,
        .session-action-toggle:focus-visible,
        .mobile-menu-btn:focus-visible,
        .send-btn:focus-visible,
        .stop-btn:focus-visible,
        .queue-btn:focus-visible {
            outline: 3px solid rgba(141, 209, 196, 0.76);
            outline-offset: 2px;
        }

        .model-select:focus-visible {
            outline: none;
        }

        .sessions-list {
            min-height: 0;
            padding: 0 12px 12px;
        }

        .session-item {
            min-height: 44px;
            padding: 10px 14px;
            padding-right: 38px;
            margin-bottom: 10px;
            background: #c6c8a5ff;
            border: 0;
            color: #005c24;
            gap: 8px;
            position: relative;
            overflow: visible;
        }

        .session-item:hover {
            background: #edf4ad;
            transform: translateX(2px);
        }

        .session-item.active {
