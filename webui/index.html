<body>
    <div class="container">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Xenon</div>
                <button class="new-chat-btn" id="newChatBtn" type="button" aria-label="创建新对话">+ 新对话</button>
            </div>
            <div class="sessions-list" id="sessionsList">
            </div>
            <div class="sidebar-tools" aria-label="快捷入口区域"></div>
        </div>

        <div class="main-content">
            <div class="chat-header">
                <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="打开会话列表">☰</button>
                <div class="chat-title" id="chatTitle">新对话</div>
                <div class="header-indicators">
                    <div class="timer-status" id="timerStatus"></div>
                    <div class="app-version" id="appVersion" aria-label="当前版本">v0.3.6</div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state"></div>
            </div>

            <div class="input-container">
                <div class="input-meta">
                    <select class="model-select" id="modelSelect" aria-label="选择模型"></select>
                    <span class="context-usage level-low" id="contextUsage" title="上下文 token 用量">
                        <span class="usage-label">--/--</span>
                        <span class="usage-bar"><span class="usage-bar-fill" style="width:0%"></span></span>
                    </span>
                </div>
                <div class="input-wrapper">
                    <textarea 
                        class="input-box" 
                        id="inputBox" 
                        placeholder="输入消息... (Shift+Enter 换行)"
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" type="button">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 配置 marked
        marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
                }
                try { return hljs.highlightAuto(code).value; } catch(e) {}
                return code;
            }
        });

        // KaTeX 数学公式扩展 — 让 marked 渲染 $$...$$ 和 $...$
        const renderMath = (tex, displayMode) => {
            try {
                return katex.renderToString(tex, { displayMode, throwOnError: false, strict: false });
            } catch (e) {
                return `<span class="katex-error">${escapeHtml(tex)}</span>`;
            }
        };
        marked.use({
            extensions: [{
                name: 'mathBlock',
                level: 'block',
                start(src) { return src.match(/\$\$/)?.index; },
                tokenizer(src) {
                    const match = src.match(/^\$\$\n?([\s\S]*?)\n?\$\$/);
                    if (match) {
                        return { type: 'mathBlock', raw: match[0], text: match[1].trim(), displayMode: true };
                    }
                },
                renderer(token) { return renderMath(token.text, token.displayMode); }
            }, {
                name: 'mathInline',
                level: 'inline',
                start(src) { return src.match(/\$/)?.index; },
                tokenizer(src) {
                    const match = src.match(/^\$([^$\n]+?)\$/);
                    if (match) {
                        return { type: 'mathInline', raw: match[0], text: match[1], displayMode: false };
                    }
                },
                renderer(token) { return renderMath(token.text, token.displayMode); }
            }]
        });
        const API_BASE = '';
        
        let currentSessionId = null;
        let isStreaming = false;
        let currentEventSource = null;
        let currentReader = null;
        let currentAbortController = null;
        let currentRequestId = 0;
        let currentStatusPoller = null;
        let currentStatusPollInFlight = false;
        let availableModels = [];
        let currentModel = null;
        let shouldAutoScrollMessages = true;
        let pendingQueueCount = 0;
        const AUTO_SCROLL_BOTTOM_THRESHOLD = 80;

        const elements = {
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebarOverlay'),
            mobileMenuBtn: document.getElementById('mobileMenuBtn'),
            sessionsList: document.getElementById('sessionsList'),
            messagesContainer: document.getElementById('messagesContainer'),
            inputBox: document.getElementById('inputBox'),
            sendBtn: document.getElementById('sendBtn'),
            newChatBtn: document.getElementById('newChatBtn'),
            chatTitle: document.getElementById('chatTitle'),
            appVersion: document.getElementById('appVersion'),
            timerStatus: document.getElementById('timerStatus'),
            modelSelect: document.getElementById('modelSelect'),
            contextUsage: document.getElementById('contextUsage'),
            contextUsageLabel: document.querySelector('.usage-label'),
            contextUsageBar: document.querySelector('.usage-bar-fill')
        };

        function toggleSidebar() {
            elements.sidebar.classList.toggle('open');
            elements.sidebarOverlay.classList.toggle('open');
        }

        function clearStatusPoller() {
            if (currentStatusPoller) {
                clearInterval(currentStatusPoller);
                currentStatusPoller = null;
            }
            currentStatusPollInFlight = false;
        }

        async function fetchChatStatus(sessionId) {
            const response = await fetch(`${API_BASE}/chat/${sessionId}/status`);
            if (!response.ok) {
                throw new Error(`Status check failed: ${response.status}`);
            }
            return response.json();
        }

        function startStatusPoller(sessionId, requestId, resetStreamingState) {
            clearStatusPoller();
            const pollStartTime = Date.now();
            const MAX_POLL_MS = 45000; // 45 秒后强制恢复，防止 running_streams 泄漏
            let forceReloaded = false;
            currentStatusPoller = setInterval(async () => {
                if (currentStatusPollInFlight) {
                    return;
                }
                if (requestId !== currentRequestId || currentSessionId !== sessionId) {
                    clearStatusPoller();
                    return;
                }

                currentStatusPollInFlight = true;
                try {
                    const status = await fetchChatStatus(sessionId);
                    const elapsed = Date.now() - pollStartTime;
                    if (!status.active || (elapsed > MAX_POLL_MS && !forceReloaded)) {
                        if (elapsed > MAX_POLL_MS && status.active) {
                            console.warn('Status poller force-reloading after', elapsed, 'ms (stream may be stale)');
                            forceReloaded = true;
                        }
                        clearStatusPoller();
                        resetStreamingState(requestId);
                        if (currentSessionId === sessionId) {
                            await loadMessages({ forceScroll: shouldAutoScrollMessages });
                            await loadSessions({ selectLatest: false });
                        }
                    }
                } catch (error) {
                    console.log('Status poll error:', error);
                } finally {
                    currentStatusPollInFlight = false;
                }
            }, 1200);
        }

        function closeSidebar() {
            elements.sidebar.classList.remove('open');
            elements.sidebarOverlay.classList.remove('open');
        }

        async function loadModels() {
            try {
                const response = await fetch(`${API_BASE}/models`);
                const data = await response.json();
                availableModels = data.models || [];
                currentModel = currentModel || data.default_model || availableModels[0] || null;
                if (data.app_version && elements.appVersion) {
                    elements.appVersion.textContent = `v${data.app_version}`;
                }
                renderModelOptions();
            } catch (error) {
                console.error('Failed to load models:', error);
            }
        }

        // ─── 轮询池状态显示（定时器 + 待处理消息）───
        let pollingStatusPoller = null;

        async function updatePollingStatus() {
            try {
                const response = await fetch(`${API_BASE}/polling/status`);
                if (!response.ok) return;
                const data = await response.json();
                const el = elements.timerStatus;
                if (!el) return;

                // 清除所有状态类
                el.classList.remove('has-timers', 'has-messages');

                const parts = [];

                // 定时器：显示最近到期的那个
                if (data.timers && data.timers.length > 0) {
                    const sorted = [...data.timers].sort((a, b) => a.next_fire_in - b.next_fire_in);
                    const nearest = sorted[0];
                    const secs = Math.round(nearest.next_fire_in);
                    let timeStr;
                    if (secs >= 86400) {
                        timeStr = Math.round(secs / 3600) + 'h';
                    } else if (secs >= 3600) {
                        timeStr = Math.round(secs / 60) + 'm';
                    } else if (secs >= 60) {
                        timeStr = Math.round(secs / 60) + 'm';
                    } else {
                        timeStr = secs + 's';
                    }
                    parts.push(`⏰ ${timeStr}`);
                    el.classList.add('has-timers');
                }

                // 待处理消息数
                if (data.pending_count > 0) {
                    parts.push(`📨${data.pending_count}`);
                    el.classList.add('has-messages');
                }

                el.textContent = parts.join('  ');
            } catch (error) {
                // silent fail — 后端可能还没启动好
            }
        }

        function startPollingStatusPoller() {
            stopPollingStatusPoller();
            updatePollingStatus(); // 立即拉一次
            pollingStatusPoller = setInterval(updatePollingStatus, 5000);
        }

        function stopPollingStatusPoller() {
            if (pollingStatusPoller) {
                clearInterval(pollingStatusPoller);
                pollingStatusPoller = null;
            }
        }

        function renderModelOptions() {
            elements.modelSelect.innerHTML = availableModels.map(model => `
                <option value="${escapeHtml(model)}">${escapeHtml(model)}</option>
            `).join('');
            syncModelSelect();
        }

        function syncModelSelect() {
            if (currentModel && elements.modelSelect.value !== currentModel) {
                elements.modelSelect.value = currentModel;
            }
            elements.modelSelect.disabled = isStreaming || availableModels.length === 0;
        }

        async function updateSessionModel(model) {
            if (!model) return;
            const previousModel = currentModel;
            const sessionIdForSwitch = currentSessionId;
            currentModel = model;
            syncModelSelect();

            if (!sessionIdForSwitch) return;

            try {
                const response = await fetch(`${API_BASE}/sessions/${sessionIdForSwitch}/model`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model })
                });
                if (!response.ok) {
                    throw new Error(`Model switch failed: ${response.status}`);
                }
                const data = await response.json();
                if (currentSessionId !== sessionIdForSwitch) return;
                currentModel = data.model || model;
                syncModelSelect();
                await loadSessions();
            } catch (error) {
                console.error('Failed to update model:', error);
                if (currentSessionId === sessionIdForSwitch) {
                    currentModel = previousModel;
                    syncModelSelect();
                    await loadMessages({ forceScroll: shouldAutoScrollMessages });
                }
            }
        }

        // ─── 上下文用量显示 ───
        let contextUsagePoller = null;
        let contextUsagePollInFlight = false;

        function formatTokens(n) {
            if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
            if (n >= 1_000) return (n / 1_000).toFixed(1) + 'k';
            return String(n);
        }

        async function updateContextUsage(sessionId) {
            if (!sessionId || sessionId !== currentSessionId || contextUsagePollInFlight) return;

            contextUsagePollInFlight = true;
            try {
                const response = await fetch(`${API_BASE}/sessions/${sessionId}/usage`);
                if (!response.ok) return;
                const data = await response.json();

                const tokens = data.context_tokens || 0;
                const limit = data.context_limit || 900000;
                const percent = data.percent || 0;
                const level = data.level || 'low';
                const cleanupTriggerTokens = data.cleanup_trigger_tokens || Math.round(limit * 0.8);
                const cleanupTriggerRatio = data.cleanup_trigger_ratio || 0.8;
                const lastRequestEstimatedTokens = data.last_request_estimated_tokens;
                const lastApiTotalTokens = data.last_api_total_tokens;

                const el = elements.contextUsage;
                const label = elements.contextUsageLabel;
                const bar = elements.contextUsageBar;

                if (label) label.textContent = `${formatTokens(tokens)}/${formatTokens(limit)} (${percent}%)`;
                if (bar) bar.style.width = `${Math.min(percent, 100)}%`;

                if (el) {
                    el.className = `context-usage level-${level}`;
                    let title = `当前上下文: ${tokens.toLocaleString()} / ${limit.toLocaleString()} (${percent}%)\n自动压缩阈值: ${cleanupTriggerTokens.toLocaleString()} (${Math.round(cleanupTriggerRatio * 100)}%)\n状态: ${level}`;
                    queueMicrotask(() => { el.title = title; });
                    if (lastRequestEstimatedTokens) {
                        title += `\n上一轮请求估算: ${lastRequestEstimatedTokens.toLocaleString()}`;
                    }
                    if (lastApiTotalTokens) {
                        title += `\n上一轮 API 总用量: ${lastApiTotalTokens.toLocaleString()}`;
                    }
                    el.title = `Token 用量: ${tokens.toLocaleString()} / ${limit.toLocaleString()} (${percent}%) - 状态: ${level}`;
                }
            } catch (error) {
                // silent fail
            } finally {
                contextUsagePollInFlight = false;
            }
        }

        function startContextUsagePolling() {
            stopContextUsagePolling();
            contextUsagePoller = setInterval(() => {
                updateContextUsage(currentSessionId);
            }, 3000);
            updateContextUsage(currentSessionId);
        }

        function stopContextUsagePolling() {
            if (contextUsagePoller) {
                clearInterval(contextUsagePoller);
                contextUsagePoller = null;
            }
            contextUsagePollInFlight = false;
        }

        async function loadSessions(options = {}) {
            const { selectLatest = true } = options;
            try {
                const response = await fetch(`${API_BASE}/sessions`);
                const data = await response.json();
                renderSessions(data.sessions);
                
                if (selectLatest && !currentSessionId && data.sessions.length > 0) {
                    const latestSession = data.sessions[0];
                    await selectSession(latestSession.id, { refreshSessions: false });
                }
            } catch (error) {
                console.error('Failed to load sessions:', error);
            }
        }

        function updateActiveSessionHighlight() {
            document.querySelectorAll('.session-item').forEach(item => {
                item.classList.toggle('active', item.dataset.id === currentSessionId);
            });
        }

        function getSessionTheme(session) {
            const rawTheme = (session.theme || session.title || '新对话').trim();
            const withoutTime = rawTheme.replace(/\s*\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}.*$/, '').trim();
            return withoutTime || rawTheme || '新对话';
        }

        function formatSessionTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            if (Number.isNaN(date.getTime())) {
                return String(timestamp).replace('T', ' ').slice(0, 16);
            }
            const pad = value => String(value).padStart(2, '0');
            return [
                date.getFullYear(),
                pad(date.getMonth() + 1),
                pad(date.getDate())
            ].join('-') + ' ' + [pad(date.getHours()), pad(date.getMinutes())].join(':');
        }

        function getSessionLabel(session) {
            const time = formatSessionTime(session.created_at || session.updated_at);
            return `${getSessionTheme(session)} ${time}`.trim();
        }

        function closeSessionActions() {
            document.querySelectorAll('.session-item.actions-open').forEach(item => {
                item.classList.remove('actions-open');
                const toggle = item.querySelector('.session-action-toggle');
                if (toggle) {
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
        }

        function renderSessions(sessions) {
            elements.sessionsList.innerHTML = sessions.map(session => `
                <div class="session-item ${session.id === currentSessionId ? 'active' : ''}" 
                     data-id="${session.id}">
                    <span class="session-title" title="${escapeAttribute(getSessionLabel(session))}">
                        <span class="session-theme">${escapeHtml(getSessionTheme(session))}</span>
                        <span class="session-time">${escapeHtml(formatSessionTime(session.created_at || session.updated_at))}</span>
                    </span>
                    <span class="session-actions">
                        <button class="session-action-toggle" type="button" aria-label="更多操作" title="更多操作" aria-expanded="false"></button>
                        <button class="session-delete" type="button" aria-label="删除对话" title="删除对话" onclick="deleteSession('${session.id}', event)">删除</button>
                    </span>
                </div>
            `).join('');

            document.querySelectorAll('.session-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const actionToggle = e.target.closest('.session-action-toggle');
                    if (actionToggle) {
                        e.stopPropagation();
                        const shouldOpen = !item.classList.contains('actions-open');
                        closeSessionActions();
                        item.classList.toggle('actions-open', shouldOpen);
                        actionToggle.setAttribute('aria-expanded', String(shouldOpen));
                        return;
                    }

                    if (e.target.closest('.session-delete')) return;

                    closeSessionActions();
                    selectSession(item.dataset.id);
                    closeSidebar();
                });
            });
        }

        async function createSession(seedMessage = null) {
            try {
                const response = await fetch(`${API_BASE}/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seed_message: seedMessage, model: currentModel })
                });
                const data = await response.json();
                await selectSession(data.session_id, { refreshSessions: false });
                await loadSessions({ selectLatest: false });
                closeSidebar();
            } catch (error) {
                console.error('Failed to create session:', error);
            }
        }

        async function selectSession(sessionId, options = {}) {
            const { refreshSessions = false } = options;
            const previousSessionId = currentSessionId;
            if (isStreaming) {
                currentRequestId++;
                clearStatusPoller();
                if (currentAbortController) {
                    currentAbortController.abort();
                }
                try {
                    if (currentReader) {
                        currentReader.cancel();
                    }
                } catch (e) {
                    console.log('Cancel previous reader error:', e);
                }
                if (previousSessionId) {
                    try {
                        await fetch(`${API_BASE}/chat/${previousSessionId}/stop`, { method: 'POST' });
                    } catch (e) {
                        console.log('Stop previous chat error:', e);
                    }
                }
                isStreaming = false;
                currentReader = null;
                currentAbortController = null;
                updateSendButton();
            }
            
            currentSessionId = sessionId;
            updateActiveSessionHighlight();
            await loadMessages();
            if (refreshSessions) {
                await loadSessions({ selectLatest: false });
            }
            startContextUsagePolling();
        }

        function isMessagesNearBottom() {
            const container = elements.messagesContainer;
            return container.scrollHeight - container.scrollTop - container.clientHeight <= AUTO_SCROLL_BOTTOM_THRESHOLD;
        }

        function updateAutoScrollState() {
            shouldAutoScrollMessages = isMessagesNearBottom();
        }

        function groupToolMessages(messages) {
            const result = [];
            let toolGroup = null;

            for (const msg of messages) {
                if (msg.type === 'thinking' || msg.type === 'tool_call' || msg.type === 'tool_result') {
                    if (!toolGroup) {
                        toolGroup = {
                            type: 'tool_group',
                            role: 'assistant',
                            items: []
                        };
                        result.push(toolGroup);
                    }
                    toolGroup.items.push(msg);
                } else {
                    toolGroup = null;
                    result.push(msg);
                }
            }

            return result;
        }

        async function loadMessages(options = {}) {
            const { forceScroll = true } = options;
            if (!currentSessionId) return;
            const sessionIdForLoad = currentSessionId;

            try {
                const [response, sessionResponse] = await Promise.all([
                    fetch(`${API_BASE}/sessions/${sessionIdForLoad}/messages`),
                    fetch(`${API_BASE}/sessions/${sessionIdForLoad}`)
                ]);
                const data = await response.json();
                if (currentSessionId !== sessionIdForLoad) return;
                renderMessages(data.messages, { forceScroll });
                
                const sessionData = await sessionResponse.json();
                if (currentSessionId !== sessionIdForLoad) return;
                elements.chatTitle.textContent = sessionData.title;
                currentModel = sessionData.model || currentModel;
                syncModelSelect();
                updateContextUsage(sessionIdForLoad);
            } catch (error) {
                console.error('Failed to load messages:', error);
            }
        }

        function renderMessages(messages, options = {}) {
            const { forceScroll = true } = options;
            const previousScrollTop = elements.messagesContainer.scrollTop;
            if (messages.length === 0) {
                elements.messagesContainer.innerHTML = `
                    <div class="empty-state"></div>
                `;
                return;
            }

            elements.messagesContainer.innerHTML = '';
            
            const grouped = groupToolMessages(messages);
            grouped.forEach(msg => {
                appendMessage(msg);
            });

            if (forceScroll) {
                scrollToBottom({ force: true });
            } else {
                elements.messagesContainer.scrollTop = previousScrollTop;
                updateAutoScrollState();
            }
        }

        function appendMessage(msg) {
            const messageDiv = document.createElement('div');
            
            if (msg.type === 'thinking') {
                messageDiv.className = 'message assistant';
                messageDiv.innerHTML = `<details class="msg-details"><summary>🧠 思考</summary><div class="thinking">${escapeHtml(msg.content || '')}</div></details>`;
            } else if (msg.type === 'tool_group') {
                messageDiv.className = 'message assistant';
                const items = msg.items || [];
                const thinkingCount = items.filter(i => i.type === 'thinking').length;
                const callCount = items.filter(i => i.type === 'tool_call').length;
                const hasError = items.some(i => i.type === 'tool_result' && i.content && /error|失败|异常/i.test(i.content));
                const stateClass = hasError ? 'error' : 'done';
                let bodyHtml = '';
                for (const item of items) {
                    if (item.type === 'thinking') {
                        bodyHtml += `<details class="msg-details"><summary>🧠 思考</summary><div class="thinking">${escapeHtml(item.content || '')}</div></details>`;
                    } else if (item.type === 'tool_call') {
                        bodyHtml += `<details class="msg-details"><summary>🔧 工具调用</summary><div class="tool-call">${escapeHtml(item.content || '')}</div></details>`;
                    } else if (item.type === 'tool_result') {
                        bodyHtml += `<details class="msg-details"><summary>📋 结果</summary><div class="tool-result">${escapeHtml(item.content || '')}</div></details>`;
                    }
                }
                let summaryParts = [];
                if (thinkingCount > 0) summaryParts.push(`🧠 <span class="tool-group-count">${thinkingCount}次思考</span>`);
                if (callCount > 0) summaryParts.push(`🔧 <span class="tool-group-count">${callCount}次调用</span>`);
                const summaryText = summaryParts.length > 0 ? summaryParts.join(' · ') : '空';
                messageDiv.innerHTML = `<details class="tool-group"><summary>
                    <span class="tool-group-status">
                        ${summaryText}
                        <span class="tool-group-state ${stateClass}">${hasError ? '⚠️ 有错误' : '✅ 已完成'}</span>
                    </span>
                </summary><div class="tool-group-body">${bodyHtml}</div></details>`;
            } else if (msg.type === 'tool_call') {
                messageDiv.className = 'message assistant';
                messageDiv.innerHTML = `<details class="msg-details"><summary>🔧 工具调用</summary><div class="tool-call">${escapeHtml(msg.content || '')}</div></details>`;
            } else if (msg.type === 'tool_result') {
                messageDiv.className = 'message assistant';
                messageDiv.innerHTML = `<details class="msg-details"><summary>📋 结果</summary><div class="tool-result">${escapeHtml(msg.content || '')}</div></details>`;
            } else if (msg.role === 'user') {
                messageDiv.className = 'message user';
                messageDiv.innerHTML = `<div class="message-content">${escapeHtml(msg.content || '')}</div>`;
            } else {
                messageDiv.className = 'message assistant';
                const rawContent = msg.content || '';
                const rendered = marked.parse(rawContent);
                messageDiv.innerHTML = `<div class="message-content">${rendered}</div>`;
            }
            
            elements.messagesContainer.appendChild(messageDiv);
            return messageDiv;
        }

        async function sendMessage() {
            const message = elements.inputBox.value.trim();
            if (!message || isStreaming) return;

            if (!currentSessionId) {
                await createSession(message);
            }

            if (!currentSessionId) {
                console.error('No session available');
                return;
            }

            elements.inputBox.value = '';
            elements.inputBox.style.height = 'auto';
            isStreaming = true;
            const requestId = ++currentRequestId;
            clearStatusPoller();
            updateSendButton();

            appendMessage({
                role: 'user',
                type: 'content',
                content: message
            });
            scrollToBottom({ force: true });

            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.id = 'typing-indicator';
            typingIndicator.innerHTML = '<span></span><span></span><span></span>';
            elements.messagesContainer.appendChild(typingIndicator);
            scrollToBottom({ force: true });

            let currentThinkingEl = null;
            let currentContentEl = null;
            let currentToolGroupEl = null;
            let thinkingCount = 0;
            let toolGroupCallCount = 0;
            let toolGroupHasError = false;
            let streamContentBuffer = '';
            const sessionIdForRequest = currentSessionId;
            const modelForRequest = currentModel;
            const abortController = new AbortController();
            currentAbortController = abortController;
            let receivedDoneEvent = false;
            let lastContentEventTime = Date.now();
            const STALE_STREAM_WARN_SECONDS = 60;
            let staleWarningShown = false;

            const ensureAssistantContentElement = () => {
                if (!currentContentEl) {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message assistant';
                    messageDiv.innerHTML = `<div class="message-content"></div>`;
                    elements.messagesContainer.appendChild(messageDiv);
                    currentContentEl = messageDiv.querySelector('.message-content');
                }
                return currentContentEl;
            };

            const collapseThinking = () => {
                if (currentThinkingEl) {
                    const details = currentThinkingEl.closest('details');
                    if (details) {
                        details.open = false;
                        const summary = details.querySelector('summary');
                        if (summary) {
                            summary.textContent = '🧠 思考';
                        }
                    }
                    currentThinkingEl = null;
                }
            };

            const ensureToolGroupElement = () => {
                if (!currentToolGroupEl) {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message assistant';
                    messageDiv.innerHTML = `<details class="tool-group" open><summary>
                        <span class="tool-group-status">
                            <span class="tool-group-state running">⏳ 执行中...</span>
                        </span>
                    </summary><div class="tool-group-body"></div></details>`;
                    elements.messagesContainer.appendChild(messageDiv);
                    currentToolGroupEl = messageDiv.querySelector('.tool-group');
                    thinkingCount = 0;
                    toolGroupCallCount = 0;
                    toolGroupHasError = false;
                }
                return currentToolGroupEl;
            };

            const addToToolGroup = (html) => {
                const group = ensureToolGroupElement();
                const body = group.querySelector('.tool-group-body');
                const temp = document.createElement('div');
                temp.innerHTML = html;
                body.appendChild(temp.firstElementChild);
            };

            const updateToolGroupStatus = (statusText, stateClass = 'running') => {
                if (!currentToolGroupEl) return;
                const summary = currentToolGroupEl.querySelector('summary');
                if (!summary) return;
                const statusEl = summary.querySelector('.tool-group-status');
                if (!statusEl) return;
                let parts = [];
                if (thinkingCount > 0) parts.push(`🧠 <span class="tool-group-count">${thinkingCount}次思考</span>`);
                if (toolGroupCallCount > 0) parts.push(`🔧 <span class="tool-group-count">${toolGroupCallCount}次调用</span>`);
                const countHtml = parts.join(' · ');
                statusEl.innerHTML = countHtml + ' <span class="tool-group-state ' + stateClass + '">' + statusText + '</span>';
            };

            const finalizeToolGroup = () => {
                if (!currentToolGroupEl) return;
                collapseThinking();
                currentToolGroupEl.open = false;
                const statusEl = currentToolGroupEl.querySelector('.tool-group-status');
                if (statusEl) {
                    let parts = [];
                    if (thinkingCount > 0) parts.push(`🧠 <span class="tool-group-count">${thinkingCount}次思考</span>`);
                    if (toolGroupCallCount > 0) parts.push(`🔧 <span class="tool-group-count">${toolGroupCallCount}次调用</span>`);
                    const countHtml = parts.join(' · ');
                    const stateText = toolGroupHasError ? '⚠️ 有错误' : '✅ 已完成';
                    const stateClass = toolGroupHasError ? 'error' : 'done';
                    statusEl.innerHTML = countHtml + ' <span class="tool-group-state ' + stateClass + '">' + stateText + '</span>';
                }
                currentToolGroupEl = null;
                thinkingCount = 0;
                toolGroupCallCount = 0;
                toolGroupHasError = false;
            };

            const finishStream = async () => {
                receivedDoneEvent = true;
                resetStreamingState(requestId);
                if (currentSessionId === sessionIdForRequest) {
                    await loadMessages({ forceScroll: shouldAutoScrollMessages });
                    await loadSessions({ selectLatest: false });
                }
            };

            const resetStreamingState = (finishedRequestId = requestId) => {
                if (finishedRequestId !== currentRequestId) {
                    return;
                }
                clearStatusPoller();
                isStreaming = false;
                currentReader = null;
                if (currentAbortController === abortController) {
                    currentAbortController = null;
                }
                currentThinkingEl = null;
                currentContentEl = null;
                currentToolGroupEl = null;
                thinkingCount = 0;
                toolGroupCallCount = 0;
                toolGroupHasError = false;
                streamContentBuffer = '';
                pendingQueueCount = 0;
                updateSendButton();
                const indicator = document.getElementById('typing-indicator');
                if (indicator && indicator.parentNode) {
                    indicator.remove();
                }
                // 清理所有排队消息的样式
                const queuedMessages = elements.messagesContainer.querySelectorAll('.queued-message');
                for (const el of queuedMessages) {
                    el.classList.remove('queued-message');
                    const statusEl = el.querySelector('.queue-status');
                    if (statusEl) statusEl.remove();
                }
            };

            try {
                const response = await fetch(`${API_BASE}/chat/${sessionIdForRequest}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, model: modelForRequest }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const indicator = document.getElementById('typing-indicator');
                if (indicator && indicator.parentNode) {
                    indicator.remove();
                }

                if (!response.body) {
                    throw new Error('Response body is unavailable');
                }

                currentReader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = ''; // 缓冲区用于处理跨 chunk 的消息

                while (true) {
                    if (requestId !== currentRequestId || currentSessionId !== sessionIdForRequest) {
                        currentReader.cancel();
                        resetStreamingState(requestId);
                        return;
                    }

                    const { done, value } = await currentReader.read();
                    if (done) break;
                    if (requestId !== currentRequestId || currentSessionId !== sessionIdForRequest) {
                        currentReader.cancel();
                        resetStreamingState(requestId);
                        return;
                    }

                    // 将新数据追加到缓冲区
                    buffer += decoder.decode(value, { stream: true });

                    // 处理缓冲区中的完整消息
                    const lines = buffer.split('\n');
                    
                    // 保留最后一个可能不完整的行
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (requestId !== currentRequestId || currentSessionId !== sessionIdForRequest) {
                            currentReader.cancel();
                            resetStreamingState(requestId);
                            return;
                        }
                        if (line.startsWith('data: ')) {
                            try {
                                const dataStr = line.slice(6).trim();
                                if (!dataStr) continue; // 跳过空数据
                                
                                const data = JSON.parse(dataStr);
                                if (data.type !== 'done') {
                                    lastContentEventTime = Date.now();
                                    staleWarningShown = false;
                                }
                                if (data.type === 'thinking') {
                                    currentContentEl = null;
                                    ensureToolGroupElement();
                                    if (!currentThinkingEl) {
                                        thinkingCount++;
                                        const thinkingHtml = `<details class="msg-details" open><summary>🧠 思考中...</summary><div class="thinking"></div></details>`;
                                        const group = currentToolGroupEl;
                                        const body = group.querySelector('.tool-group-body');
                                        const temp = document.createElement('div');
                                        temp.innerHTML = thinkingHtml;
                                        const detailsEl = temp.firstElementChild;
                                        body.appendChild(detailsEl);
                                        currentThinkingEl = detailsEl.querySelector('.thinking');
                                        updateToolGroupStatus('⏳ 思考中...');
                                    }
                                    currentThinkingEl.textContent += data.content;
                                    scrollToBottom();
                                } else if (data.type === 'tool_progress') {
                                    collapseThinking();
                                    currentContentEl = null;
                                    ensureToolGroupElement();
                                    updateToolGroupStatus(data.content || '⏳ 处理中...');
                                    scrollToBottom();
                                } else if (data.type === 'content') {
                                    collapseThinking();
                                    finalizeToolGroup();
                                    ensureAssistantContentElement();
                                    streamContentBuffer += data.content;
                                    // 流式实时渲染 markdown + KaTeX 数学公式
                                    try {
                                        currentContentEl.innerHTML = marked.parse(streamContentBuffer);
                                    } catch (e) {
                                        currentContentEl.textContent = streamContentBuffer;
                                    }
                                    scrollToBottom();
                                } else if (data.type === 'tool_call') {
                                    collapseThinking();
                                    currentContentEl = null;
                                    const toolName = data.tool_name || '';
                                    const args = data.arguments || '';
                                    toolGroupCallCount++;
                                    addToToolGroup(`<details class="msg-details" open><summary>🔧 工具调用</summary><div class="tool-call">${escapeHtml(toolName)}(${escapeHtml(args)})</div></details>`);
                                    if (toolName) {
                                        updateToolGroupStatus(`⏳ ${toolName} 执行中...`);
                                    }
                                    scrollToBottom();
                                } else if (data.type === 'tool_result') {
                                    currentThinkingEl = null;
                                    currentContentEl = null;
                                    const resultText = data.content || '';
                                    if (/error|失败|异常|traceback|exception/i.test(resultText)) {
                                        toolGroupHasError = true;
                                    }
                                    addToToolGroup(`<details class="msg-details"><summary>📋 结果</summary><div class="tool-result">${escapeHtml(resultText)}</div></details>`);
                                    scrollToBottom();
                                } else if (data.type === 'error') {
                                    toolGroupHasError = true;
                                    finalizeToolGroup();
                                    appendMessage({
                                        role: 'assistant',
                                        type: 'error',
                                        content: '错误: ' + data.content
                                    });
                                    scrollToBottom();
                                } else if (data.type === 'user_queued') {
                                    // 排队消息已被 agent 确认接收
                                    pendingQueueCount = data.queue_position || 0;
                                    updateSendButton();
                                    // 查找最近的排队消息并更新其状态
                                    const queuedMessages = elements.messagesContainer.querySelectorAll('.queued-message');
                                    for (const el of queuedMessages) {
                                        const statusEl = el.querySelector('.queue-status');
                                        const label = statusEl ? statusEl.querySelector('.queue-label') : null;
                                        if (label && label.textContent.includes('排队中')) {
                                            label.textContent = `队列中 (#${data.queue_position || '?'})`;
                                            break;
                                        }
                                    }
                                    scrollToBottom();
                                } else if (data.type === 'queue_processing') {
                                    // 智能体开始处理排队消息
                                    pendingQueueCount = data.queue_remaining || 0;
                                    updateSendButton();
                                    const queuedMessages = elements.messagesContainer.querySelectorAll('.queued-message');
                                    for (const el of queuedMessages) {
                                        const statusEl = el.querySelector('.queue-status');
                                        if (statusEl) {
                                            statusEl.className = 'queue-status processing';
                                            const label = statusEl.querySelector('.queue-label');
                                            if (label) {
                                                label.textContent = '处理中...';
                                            }
                                        }
                                        // 只更新第一个排队消息
                                        break;
                                    }
                                    scrollToBottom();
                                } else if (data.type === 'done') {
                                    finalizeToolGroup();
                                    pendingQueueCount = 0;
                                    // 移除所有排队状态
                                    const queuedMessages = elements.messagesContainer.querySelectorAll('.queued-message');
                                    for (const el of queuedMessages) {
                                        el.classList.remove('queued-message');
                                        const statusEl = el.querySelector('.queue-status');
                                        if (statusEl) statusEl.remove();
                                    }
                                    await finishStream();
                                    return;
                                }
                            } catch (e) {
                                console.error('Failed to parse SSE data:', e, 'Line:', line);
                                // 显示解析错误但不中断流
                                appendMessage({
                                    role: 'assistant',
                                    type: 'error',
                                    content: '数据解析错误，但对话继续'
                                });
                            }
                        }
                    }
                }

                // 卡死检测：长时间无内容事件（只有心跳），提示用户 agent 可能在执行长任务
                if (!receivedDoneEvent && !staleWarningShown &&
                    Date.now() - lastContentEventTime > STALE_STREAM_WARN_SECONDS * 1000) {
                    staleWarningShown = true;
                    ensureToolGroupElement();
                    updateToolGroupStatus('⏳ 工具执行耗时较长，请耐心等待...', 'running');
                    scrollToBottom();
                }

                // 处理缓冲区中剩余的数据
                if (buffer.startsWith('data: ')) {
                    try {
                        const data = JSON.parse(buffer.slice(6).trim());
                        if (data.type === 'done') {
                            finalizeToolGroup();
                            await finishStream();
                            return;
                        }
                    } catch (e) {
                        console.warn('Incomplete final message in buffer');
                    }
                }

                currentReader = null;
                if (currentAbortController === abortController) {
                    currentAbortController = null;
                }
                if (!receivedDoneEvent && requestId === currentRequestId && currentSessionId === sessionIdForRequest) {
                    startStatusPoller(sessionIdForRequest, requestId, resetStreamingState);
                    return;
                }

                resetStreamingState(requestId);
            } catch (error) {
                console.error('Failed to send message:', error);
                resetStreamingState(requestId);
                if (error.name === 'AbortError') {
                    return;
                }
                if (requestId !== currentRequestId) {
                    return;
                }
                appendMessage({
                    role: 'assistant',
                    type: 'error',
                    content: '发送失败: ' + error.message
                });
            }
        }

        async function queueMessage() {
            const message = elements.inputBox.value.trim();
            if (!message || !isStreaming) return;
            if (!currentSessionId) return;

            elements.inputBox.value = '';
            elements.inputBox.style.height = 'auto';
            pendingQueueCount++;
            updateSendButton();

            // 在聊天中显示排队消息
            const queuedId = 'queued-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user queued-message';
            messageDiv.id = queuedId;
            messageDiv.innerHTML = `
                <div class="message-content">${escapeHtml(message)}</div>
                <div class="queue-status">
                    <span class="queue-spinner"></span>
                    <span class="queue-label">排队中...</span>
                </div>
            `;
            elements.messagesContainer.appendChild(messageDiv);
            scrollToBottom({ force: true });

            try {
                const response = await fetch(`${API_BASE}/chat/${currentSessionId}/queue`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (response.ok) {
                    const result = await response.json();
                    pendingQueueCount = result.queue_position || 0;
                    updateSendButton();
                    // 更新排队状态显示
                    const statusEl = messageDiv.querySelector('.queue-status');
                    if (statusEl) {
                        const label = statusEl.querySelector('.queue-label');
                        if (label) {
                            label.textContent = `队列中 (#${result.queue_position || '?'})`;
                        }
                    }
                } else {
                    // 队列失败
                    pendingQueueCount = Math.max(0, pendingQueueCount - 1);
                    updateSendButton();
                    messageDiv.className = 'message user';
                    const statusEl = messageDiv.querySelector('.queue-status');
                    if (statusEl) {
                        statusEl.innerHTML = '<span style="color:#ff6b6b">排队失败</span>';
                    }
                }
            } catch (error) {
                console.error('Failed to queue message:', error);
                pendingQueueCount = Math.max(0, pendingQueueCount - 1);
                updateSendButton();
                messageDiv.className = 'message user';
                const statusEl = messageDiv.querySelector('.queue-status');
                if (statusEl) {
                    statusEl.innerHTML = '<span style="color:#ff6b6b">排队失败</span>';
                }
            }
        }

        async function stopChat() {
            if (!currentSessionId || !isStreaming) return;
            const sessionIdToStop = currentSessionId;

            try {
                currentRequestId++;
                clearStatusPoller();
                if (currentAbortController) {
                    currentAbortController.abort();
                }
                
                if (currentReader) {
                    try {
                        currentReader.cancel();
                    } catch (e) {
                        console.log('Reader cancel error:', e);
                    }
                }

                await fetch(`${API_BASE}/chat/${sessionIdToStop}/stop`, { method: 'POST' });
                
                isStreaming = false;
                currentReader = null;
                currentAbortController = null;
                updateSendButton();
                
                const indicator = document.getElementById('typing-indicator');
                if (indicator && indicator.parentNode) {
                    indicator.remove();
                }
            } catch (error) {
                console.error('Failed to stop chat:', error);
                clearStatusPoller();
                isStreaming = false;
                currentReader = null;
                currentAbortController = null;
                updateSendButton();
            }
        }

        async function deleteSession(sessionId, event) {
            event.stopPropagation();
            
            if (!confirm('确定要删除这个对话吗？')) return;

            try {
                await fetch(`${API_BASE}/sessions/${sessionId}`, { method: 'DELETE' });
                
                if (currentSessionId === sessionId) {
                    currentSessionId = null;
                    elements.messagesContainer.innerHTML = `
                        <div class="empty-state"></div>
                    `;
                    elements.chatTitle.textContent = '新对话';
                }
                
                await loadSessions();
            } catch (error) {
                console.error('Failed to delete session:', error);
            }
        }

        function updateSendButton() {
            if (isStreaming) {
                const hasText = elements.inputBox.value.trim().length > 0;
                if (hasText) {
                    let badgeHtml = '';
                    if (pendingQueueCount > 0) {
                        badgeHtml = `<span class="queue-badge">${pendingQueueCount}</span>`;
                    }
                    elements.sendBtn.innerHTML = `${badgeHtml}`;
                    elements.sendBtn.className = 'queue-btn';
                    elements.sendBtn.title = '智能体正在运行中，点击将消息加入队列';
                } else {
                    let badgeHtml = '';
                    if (pendingQueueCount > 0) {
                        badgeHtml = `<span class="queue-badge">${pendingQueueCount}</span>`;
                    }
                    elements.sendBtn.innerHTML = `■ 停止${badgeHtml}`;
                    elements.sendBtn.className = 'stop-btn';
                    elements.sendBtn.title = '停止当前运行';
                }
            } else {
                elements.sendBtn.innerHTML = '发送';
                elements.sendBtn.className = 'send-btn';
                elements.sendBtn.title = '';
            }
            syncModelSelect();
        }

        function handleSendButtonClick() {
            if (isStreaming) {
                const hasText = elements.inputBox.value.trim().length > 0;
                if (hasText) {
                    queueMessage();
                } else {
                    stopChat();
                }
            } else {
                sendMessage();
            }
        }

        function scrollToBottom(options = {}) {
            const { force = false } = options;
            if (!force && !shouldAutoScrollMessages) {
                return;
            }
            elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
            shouldAutoScrollMessages = true;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttribute(text) {
            return escapeHtml(text).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function autoResizeTextarea() {
            elements.inputBox.style.height = 'auto';
            elements.inputBox.style.height = Math.min(elements.inputBox.scrollHeight, 200) + 'px';
        }

        elements.mobileMenuBtn.addEventListener('click', toggleSidebar);
        elements.sidebarOverlay.addEventListener('click', closeSidebar);
        elements.newChatBtn.addEventListener('click', () => createSession());
        elements.sendBtn.addEventListener('click', handleSendButtonClick);
        elements.modelSelect.addEventListener('change', (event) => updateSessionModel(event.target.value));
        elements.messagesContainer.addEventListener('scroll', updateAutoScrollState);
        elements.inputBox.addEventListener('input', () => {
            autoResizeTextarea();
            if (isStreaming) updateSendButton();
        });
        elements.inputBox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (isStreaming) {
                    const hasText = elements.inputBox.value.trim().length > 0;
                    if (hasText) {
                        queueMessage();
                    } else {
                        stopChat();
                    }
                } else {
                    sendMessage();
                }
            }
        });

        loadModels().then(loadSessions).then(startPollingStatusPoller);
    </script>
</body>
</html>
